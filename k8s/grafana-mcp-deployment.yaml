apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-mcp-config
  namespace: monitoring
data:
  GRAFANA_URL: "http://kps-grafana.monitoring.svc.cluster.local:80"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp
  namespace: monitoring
  labels:
    app: grafana-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-mcp
  template:
    metadata:
      labels:
        app: grafana-mcp
    spec:
      containers:
      - name: grafana-mcp
        image: mcp/grafana:latest
        imagePullPolicy: IfNotPresent
        args: 
          - "-transport"
          - "streamable-http"
          - "-address"
          - "0.0.0.0:8080"
          - "-endpoint-path"
          - "/mcp"
          - "-log-level"
          - "info"
        env:
        - name: GRAFANA_URL
          valueFrom:
            configMapKeyRef:
              name: grafana-mcp-config
              key: GRAFANA_URL
        - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
          valueFrom:
            secretKeyRef:
              name: grafana-mcp-secret
              key: GRAFANA_SERVICE_ACCOUNT_TOKEN
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-mcp
  namespace: monitoring
  labels:
    app: grafana-mcp
spec:
  selector:
    app: grafana-mcp
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
